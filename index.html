<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تقييم منصة الإمام الشاطبي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #103f35 0%, #1a5c51 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #103f35 0%, #1a5c51 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px 20px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #103f35;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .form-group .description {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        select, input[type="text"], input[type="search"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #103f35;
            box-shadow: 0 0 0 3px rgba(16, 63, 53, 0.1);
        }

        .country-input-wrapper {
            position: relative;
        }

        .country-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #ddd;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .country-suggestions.active {
            display: block;
        }

        .country-suggestion-item {
            padding: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
            border-bottom: 1px solid #f0f0f0;
        }

        .country-suggestion-item:hover {
            background-color: #f5f5f5;
            padding-right: 16px;
        }

        .country-suggestion-item:last-child {
            border-bottom: none;
        }

        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-option, .checkbox-option {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option:hover, .checkbox-option:hover {
            background-color: #f5f5f5;
            border-color: #103f35;
        }

        .radio-option input, .checkbox-option input {
            margin-left: 10px;
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .rating-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
        }

        .star {
            font-size: 42px;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 0.4;
        }

        .star:hover {
            transform: scale(1.3);
            opacity: 0.8;
        }

        .star.active {
            transform: scale(1.3);
            opacity: 1;
            filter: drop-shadow(0 0 5px rgba(16, 63, 53, 0.5));
        }

        .rating-value {
            font-size: 14px;
            color: #103f35;
            font-weight: 600;
            min-width: 60px;
            text-align: center;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn {
            background: linear-gradient(135deg, #103f35 0%, #1a5c51 100%);
            color: white;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 63, 53, 0.3);
        }

        .reset-btn {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .reset-btn:hover {
            background: #e0e0e0;
        }

        .success-message {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
        }

        .required {
            color: #e74c3c;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px auto;
            }

            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 20px 15px;
            }

            .country-suggestions {
                max-height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 استمارة التقييم</h1>
            <p>منصة الإمام الشاطبي لتعليم القرآن</p>
        </div>

        <div class="content">
            <form id="surveyForm">
                <!-- اسم الطالب -->
                <div class="form-group">
                    <label>اسمك 👤 <span class="required">*</span></label>
                    <input
                        type="text"
                        id="studentName"
                        name="studentName"
                        placeholder="اكتب اسمك الكامل"
                        required>
                </div>

                <!-- البلد -->
                <div class="form-group">
                    <label>البلد 🌍 <span class="required">*</span></label>
                    <div class="country-input-wrapper">
                        <input
                            type="search"
                            id="country"
                            placeholder="اكتب دولتك (مثال: مصر، السعودية...)"
                            autocomplete="off"
                            required>
                        <div class="country-suggestions" id="countrySuggestions"></div>
                    </div>
                </div>

                <!-- سنوات الدراسة -->
                <div class="form-group">
                    <label>كم سنة تدرس معنا؟ <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <span>أقل من سنة</span>
                            <input type="radio" name="years" value="أقل من سنة" required>
                        </label>
                        <label class="radio-option">
                            <span>1-3 سنوات</span>
                            <input type="radio" name="years" value="1-3 سنوات" required>
                        </label>
                        <label class="radio-option">
                            <span>3-5 سنوات</span>
                            <input type="radio" name="years" value="3-5 سنوات" required>
                        </label>
                        <label class="radio-option">
                            <span>أكثر من 5 سنوات</span>
                            <input type="radio" name="years" value="أكثر من 5 سنوات" required>
                        </label>
                    </div>
                </div>

                <!-- تقييم المعلمين -->
                <div class="form-group">
                    <label>تقييمك لجودة التدريس والمعلمين <span class="required">*</span></label>
                    <div class="rating-group" id="teacherRating">
                        <span class="star" data-value="1">⭐</span>
                        <span class="star" data-value="2">⭐</span>
                        <span class="star" data-value="3">⭐</span>
                        <span class="star" data-value="4">⭐</span>
                        <span class="star" data-value="5">⭐</span>
                        <span class="rating-value" id="teacherRatingDisplay">—</span>
                    </div>
                    <input type="hidden" id="teacherRatingValue" name="teacherRating" required>
                </div>

                <!-- السؤال المفتوح 1: التجويد والقراءة الصحيحة -->
                <div class="form-group">
                    <label>كيف تحسنت طريقة قراءتك للقرآن بعد الدراسة معنا؟ <span class="required">*</span></label>
                    <textarea id="q1_reading" name="q1_reading" placeholder="اكتب رأيك بكلمات قليلة..." required></textarea>
                </div>

                <!-- السؤال المفتوح 2: الجانب الروحي والإيماني -->
                <div class="form-group">
                    <label>هل أثرت المنصة على جانبك الروحي والإيماني والتربوي؟ كيف تغيرت علاقتك بالقرآن والله؟ <span class="required">*</span></label>
                    <textarea id="q2_spiritual" name="q2_spiritual" placeholder="شارك تأثير المنصة على روحك وإيمانك..." required></textarea>
                </div>

                <!-- المتابعة من المعلم أو المعلمة -->
                <div class="form-group">
                    <label>هل يتابعك المعلم أو المعلمة؟ <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <span>نعم، يتابعني بانتظام ✅</span>
                            <input type="radio" name="teacherFollowUp" value="نعم، يتابعني بانتظام" required>
                        </label>
                        <label class="radio-option">
                            <span>نعم، لكن المتابعة محدودة 👍</span>
                            <input type="radio" name="teacherFollowUp" value="نعم، لكن المتابعة محدودة" required>
                        </label>
                        <label class="radio-option">
                            <span>لا، المتابعة قليلة جداً ❌</span>
                            <input type="radio" name="teacherFollowUp" value="لا، المتابعة قليلة جداً" required>
                        </label>
                    </div>
                </div>

                <!-- السؤال المفتوح 3: المتابعة الشخصية -->
                <div class="form-group">
                    <label>كيف كانت تجربتك مع المعلم أو المعلمة؟ هل شعرت بمتابعة شخصية؟ <span class="required">*</span></label>
                    <textarea id="q3_teacher" name="q3_teacher" placeholder="اكتب عن تجربتك مع المعلم أو المعلمة والمتابعة الشخصية..." required></textarea>
                </div>

                <!-- السؤال المفتوح 4: الروايات والطرق والقراءات (متخصص) -->
                <div class="form-group">
                    <label>هل أصبحت قادراً على التفريق ما بين رواية وأخرى، وما بين طريق وآخر، وما بين قراءة وأخرى؟ <span class="required">*</span></label>
                    <textarea id="q4_advanced" name="q4_advanced" placeholder="اكتب عما تعلمته عن الروايات والطرق والقراءات المختلفة..." required></textarea>
                </div>

                <!-- السؤال المفتوح 5: التأثير التربوي -->
                <div class="form-group">
                    <label>هل لاحظت تأثيراً على سلوكك وأخلاقك من خلال دراسة القرآن معنا؟ <span class="required">*</span></label>
                    <textarea id="q5_behavior" name="q5_behavior" placeholder="اكتب عن التأثيرات التربوية والسلوكية التي لاحظتها..." required></textarea>
                </div>

                <!-- السؤال المفتوح 6: النصيحة للطلاب الجدد -->
                <div class="form-group">
                    <label>ماذا تقول لطالب جديد يتردد في الالتحاق؟ <span class="required">*</span></label>
                    <textarea id="q6_advice" name="q6_advice" placeholder="شارك نصيحتك وتشجيعك للطلاب الجدد..." required></textarea>
                </div>

                <!-- التوصية -->
                <div class="form-group">
                    <label>هل ستوصي أصدقاءك/أهلك بالدراسة معنا؟ <span class="required">*</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <span>بالتأكيد، بدون تردد ❤️</span>
                            <input type="radio" name="recommend" value="بالتأكيد، بدون تردد" required>
                        </label>
                        <label class="radio-option">
                            <span>نعم، لكن مع ملاحظات 👍</span>
                            <input type="radio" name="recommend" value="نعم، لكن مع ملاحظات" required>
                        </label>
                        <label class="radio-option">
                            <span>قد يكون 🤔</span>
                            <input type="radio" name="recommend" value="قد يكون" required>
                        </label>
                        <label class="radio-option">
                            <span>لا</span>
                            <input type="radio" name="recommend" value="لا" required>
                        </label>
                    </div>
                </div>

                <!-- التقييم العام -->
                <div class="form-group">
                    <label>تقييمك العام للمنصة من 10 <span class="required">*</span></label>
                    <div class="rating-group" id="overallRating">
                        <span class="star" data-value="1">1️⃣</span>
                        <span class="star" data-value="2">2️⃣</span>
                        <span class="star" data-value="3">3️⃣</span>
                        <span class="star" data-value="4">4️⃣</span>
                        <span class="star" data-value="5">5️⃣</span>
                        <span class="star" data-value="6">6️⃣</span>
                        <span class="star" data-value="7">7️⃣</span>
                        <span class="star" data-value="8">8️⃣</span>
                        <span class="star" data-value="9">9️⃣</span>
                        <span class="star" data-value="10">🔟</span>
                        <span class="rating-value" id="overallRatingDisplay">—</span>
                    </div>
                    <input type="hidden" id="overallRatingValue" name="overallRating" required>
                </div>

                <!-- الأزرار -->
                <div class="button-group">
                    <button type="reset" class="reset-btn">حذف</button>
                    <button type="submit" class="submit-btn">📤 إرسال التقييم</button>
                </div>

                <div class="success-message" id="successMessage">
                    ✅ شكراً لك! تم استقبال تقييمك بنجاح
                </div>
            </form>
        </div>
    </div>

    <script>
        // قائمة الدول
        const countries = [
            'السعودية',
            'مصر',
            'الإمارات',
            'الأردن',
            'المغرب',
            'تونس',
            'الجزائر',
            'الكويت',
            'قطر',
            'البحرين',
            'عمان',
            'اليمن',
            'سوريا',
            'لبنان',
            'فلسطين',
            'العراق',
            'إيران',
            'تركيا',
            'باكستان',
            'بنغلاديش',
            'الهند',
            'ماليزيا',
            'إندونيسيا',
            'سنغافورة',
            'تايلاند',
            'الفلبين',
            'كندا',
            'أمريكا',
            'بريطانيا',
            'فرنسا',
            'ألمانيا',
            'إيطاليا',
            'إسبانيا',
            'هولندا',
            'بلجيكا',
            'السويد',
            'النرويج',
            'الدنمارك',
            'فنلندا',
            'أستراليا',
            'نيوزيلندا',
            'جنوب أفريقيا',
            'كينيا',
            'نيجيريا',
            'غانا',
            'أخرى'
        ];

        // نظام البحث عن الدول
        const countryInput = document.getElementById('country');
        const countrySuggestions = document.getElementById('countrySuggestions');

        countryInput.addEventListener('input', (e) => {
            const value = e.target.value.trim();

            if (value.length === 0) {
                countrySuggestions.classList.remove('active');
                return;
            }

            const filtered = countries.filter(country =>
                country.includes(value) || value.includes(country)
            );

            if (filtered.length === 0) {
                countrySuggestions.classList.remove('active');
                return;
            }

            countrySuggestions.innerHTML = filtered.map(country =>
                `<div class="country-suggestion-item" data-country="${country}">${country}</div>`
            ).join('');

            countrySuggestions.classList.add('active');

            document.querySelectorAll('.country-suggestion-item').forEach(item => {
                item.addEventListener('click', () => {
                    countryInput.value = item.dataset.country;
                    countrySuggestions.classList.remove('active');
                });
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.country-input-wrapper')) {
                countrySuggestions.classList.remove('active');
            }
        });

        // نظام التصنيف بالنجوم
        function setupRating(containerId, inputId, displayId = null) {
            const container = document.getElementById(containerId);
            const input = document.getElementById(inputId);
            const displayElement = displayId ? document.getElementById(displayId) : null;
            const stars = container.querySelectorAll('.star');

            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const value = star.dataset.value;
                    input.value = value;

                    stars.forEach(s => s.classList.remove('active'));
                    for (let i = 0; i < value; i++) {
                        stars[i].classList.add('active');
                    }

                    if (displayElement) {
                        displayElement.textContent = value;
                    }
                });

                star.addEventListener('mouseover', () => {
                    const value = star.dataset.value;
                    stars.forEach(s => s.classList.remove('active'));
                    for (let i = 0; i < value; i++) {
                        stars[i].classList.add('active');
                    }

                    if (displayElement) {
                        displayElement.textContent = value;
                    }
                });
            });

            container.addEventListener('mouseleave', () => {
                const currentValue = input.value;
                stars.forEach(s => s.classList.remove('active'));
                if (currentValue) {
                    for (let i = 0; i < currentValue; i++) {
                        stars[i].classList.add('active');
                    }
                }
                if (displayElement) {
                    displayElement.textContent = currentValue || '—';
                }
            });
        }

        setupRating('teacherRating', 'teacherRatingValue', 'teacherRatingDisplay');
        setupRating('overallRating', 'overallRatingValue', 'overallRatingDisplay');

        // معالجة الإرسال
            document.getElementById('surveyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = Object.fromEntries(formData);

            const submitBtn = this.querySelector('.submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ جاري الإرسال...';

            fetch('https://script.google.com/macros/s/AKfycby3tSPgDikAMq77ueMq5CLPyugbB-X6r_ov2SUkhP2m2XAB-oaHQyVV2t4VpRLx72o/exec', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            })
            .then(() => {
                const successMsg = document.getElementById('successMessage');
                successMsg.style.display = 'block';
                successMsg.textContent = '✅ شكراً لك! تم استقبال تقييمك بنجاح وحفظه';

                setTimeout(() => {
                    this.reset();
                    successMsg.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '📤 إرسال التقييم';
                    document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
                    document.getElementById('teacherRatingDisplay').textContent = '—';
                    document.getElementById('overallRatingDisplay').textContent = '—';
                }, 3000);
            })
            .catch(error => {
                console.error('خطأ في الإرسال:', error);
                alert('عذراً، حدث خطأ. حاول مرة أخرى');
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 إرسال التقييم';
            });
        });
    </script>
</body>
</html>
